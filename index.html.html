<!DOCTYPE html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Volts Energia Solar - Revenda Oficial Intelbras</title>
    <meta name="description" content="Reduza sua conta de luz em até 95% com a Volts Energia Solar. Revenda oficial Intelbras." />
    
    <!-- Tailwind is kept via CDN for simplicity in this setup, 
         though in a full build you might import it in CSS. 
         This works perfectly fine for this landing page. -->
    <script src="https://cdn.tailwindcss.com"></script>
    
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <style>
      body {
        font-family: 'Manrope', sans-serif;
        background-color: #000000; /* Black Base */
        color: #F8FAFC; /* Slate 50 - Light Text */
        overflow-x: hidden;
        margin: 0;
        padding: 0;
      }
      /* Dark Glass Effect */
      .glass-dark {
        background: rgba(10, 10, 10, 0.8);
        backdrop-filter: blur(12px);
        -webkit-backdrop-filter: blur(12px);
        border-bottom: 1px solid rgba(255, 214, 0, 0.1); /* Yellow tint border */
      }
      .text-gradient {
        background-clip: text;
        -webkit-background-clip: text;
        -webkit-text-fill-color: transparent;
        background-image: linear-gradient(to right, #FFD600, #0EA5E9); /* Yellow to Blue */
      }
      /* Custom Scrollbar Dark */
      ::-webkit-scrollbar {
        width: 10px;
      }
      ::-webkit-scrollbar-track {
        background: #0F172A;
      }
      ::-webkit-scrollbar-thumb {
        background: #334155;
        border-radius: 5px;
      }
      ::-webkit-scrollbar-thumb:hover {
        background: #475569;
      }
    </style>
    <script>
      tailwind.config = {
        theme: {
          extend: {
            colors: {
              volts: {
                navy: '#0F172A',      /* Slate 900 - Dark Backgrounds */
                navyLight: '#1E293B', /* Slate 800 - Card Backgrounds */
                blue: '#0EA5E9',      /* Sky 500 - Bright Blue Accents */
                yellow: '#FFD600',    /* Primary Brand Yellow */
                yellowLight: '#FEF08A', /* Light Yellow */
                intelbras: '#00A335', /* Intelbras Official Green */
                gray: '#94A3B8',      /* Slate 400 - Muted Text */
              }
            },
            fontFamily: {
              sans: ['Manrope', 'sans-serif'],
            },
            animation: {
              'float': 'float 6s ease-in-out infinite',
              'pulse-slow': 'pulse 4s cubic-bezier(0.4, 0, 0.6, 1) infinite',
              'shimmer': 'shimmer 2s infinite linear',
            },
            keyframes: {
              float: {
                '0%, 100%': { transform: 'translateY(0)' },
                '50%': { transform: 'translateY(-10px)' },
              },
              shimmer: {
                '0%': { transform: 'translateX(-100%)' },
                '100%': { transform: 'translateX(100%)' }
              }
            }
          }
        }
      }
    </script>
